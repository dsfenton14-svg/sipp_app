name: Build SiPP release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.0

      - name: Build application bundle
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed
          --name SiPP --icon imagenes/icono1.ico
          --add-data "imagenes;imagenes" --collect-data customtkinterthemes SiPP.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" installer\SiPP.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiPP-Setup-${{ github.ref_name }}
          path: dist/installer/SiPP-Setup-${{ github.ref_name }}.exe
          if-no-files-found: error

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = "dist/installer/SiPP-Setup-${{ github.ref_name }}.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  SiPP-Setup-${{ github.ref_name }}.exe" | Set-Content "dist/installer/SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "dist/installer/SiPP-Setup-${{ github.ref_name }}.exe"
          dist/installer/SHA256SUMS.txt
          --generate-notes
          --title "SiPP ${{ github.ref_name }}"
          --notes "Instalador oficial de SiPP. Descarga únicamente desde este Release de GitHub. Verifica SHA-256 con SHA256SUMS.txt."
